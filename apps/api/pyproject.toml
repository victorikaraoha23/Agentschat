[project]
name = "agentschat-api"
version = "0.1.0"
description = "FastAPI backend/API for AgentsChat."
readme = "README.md"
# Same interpreter range as the Hermes runtime; verified here (venv runs Python 3.11.16).
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pydantic arrives transitively through FastAPI; it is not declared here.
    "fastapi>=0.133,<1",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    # httpx backs FastAPI's TestClient (Starlette's test transport).
    "httpx>=0.28",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `app/` importable from `tests/` without installing a package.
pythonpath = ["."]
